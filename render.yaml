# Render Blueprint. Secrets are never stored here: SECRET_KEY is generated by
# Render, and DATABASE_URL is entered by you in the dashboard (sync: false).
services:
  - type: web
    name: lifetracker
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TIME_ZONE
        value: UTC
      - key: ALLOW_REGISTRATION
        value: "True"
